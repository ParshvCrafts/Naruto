<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naruto Jutsu</title>
  <link rel="icon" href="data:,">  <!-- no favicon request (keeps the console 404-free) -->
  <!-- Single stylesheet (B17: inline critical CSS removed). serve.py sends no-cache. -->
  <link rel="stylesheet" href="app.css?v=7">
</head>
<body>
  <div class="app-container">
    <!-- Camera + main canvas stack — fills the full viewport -->
    <div class="canvas-wrap">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>        <!-- main effects canvas -->
      <canvas id="hud-canvas"></canvas>    <!-- HUD overlay (separate z-layer) -->

      <!-- Startup / failure messages (loading, offline, camera blocked or lost, no model) -->
      <div id="status-overlay" class="busy" role="status" aria-live="polite" data-tone="info">
        <div class="so-card">
          <div class="so-spinner" aria-hidden="true"></div>
          <div class="so-title">Loading ninja tools…</div>
          <div class="so-detail">Downloading hand-tracking models (the first load can take ~10 s).</div>
          <button class="so-action ctrl-btn" hidden></button>
        </div>
      </div>

      <!-- Controls float as an overlay at the bottom -->
      <div class="controls">
        <button id="btn-record"     class="ctrl-btn">⏺ Record</button>
        <button id="btn-demo"       class="ctrl-btn-ghost">⬜ Demo [D]</button>
        <button id="btn-fullscreen" class="ctrl-btn-ghost">⛶ Fullscreen [F]</button>
        <label class="ctrl-label">Chakra:
          <select id="chakra-select" class="ctrl-select">
            <option value="#00BFFF">Blue (default)</option>
            <option value="#FF3333">Red (Nine-Tails)</option>
            <option value="#9B59B6">Purple (Rinnegan)</option>
            <option value="#2ECC71">Green (Medical)</option>
            <option value="#F1C40F">Gold</option>
          </select>
        </label>
        <span id="model-status" class="status-text" role="status">Loading model…</span>
      </div>
    </div>
  </div>

  <!-- Recording indicator (DOM: never captured in the video; hidden in demo mode) -->
  <div id="rec-badge" hidden>● REC 0:00</div>

  <!-- Exit-demo hint (visible only in demo mode) -->
  <div id="demo-hint">Press D to exit demo</div>

  <!-- CDN libraries (globals: Holistic, SelfieSegmentation, Camera, tf) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1675466124/drawing_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic@0.5.1675471629/holistic.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1.1675465747/selfie_segmentation.js"></script>

  <!-- Boot guard: if app.js (or one of its modules) fails to load, the module never runs
       and the loading card would spin forever. Plain script, so it runs regardless. -->
  <script>
    setTimeout(function () {
      if (window.__narutoBooted) return;
      var o = document.getElementById('status-overlay');
      if (!o) return;
      o.hidden = false; o.classList.remove('busy'); o.dataset.tone = 'error';
      o.querySelector('.so-title').textContent = 'The app did not start';
      o.querySelector('.so-detail').textContent = 'A file failed to load. Check your connection and reload.';
      var b = o.querySelector('.so-action');
      b.hidden = false; b.textContent = 'Reload'; b.onclick = function () { location.reload(); };
    }, 25000);
  </script>
  <!-- Main app (ES6 module) -->
  <script type="module" src="app.js"></script>
</body>
</html>
