<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naruto Jutsu</title>
  <!-- Single stylesheet (B17: inline critical CSS removed). serve.py sends no-cache. -->
  <link rel="stylesheet" href="app.css?v=5">
</head>
<body>
  <div class="app-container">
    <!-- Camera + main canvas stack — fills the full viewport -->
    <div class="canvas-wrap">
      <video id="video" autoplay playsinline></video>
      <canvas id="canvas"></canvas>        <!-- main effects canvas -->
      <canvas id="hud-canvas"></canvas>    <!-- HUD overlay (separate z-layer) -->

      <!-- Controls float as an overlay at the bottom -->
      <div class="controls">
        <button id="btn-record"     class="ctrl-btn">⏺ Record</button>
        <button id="btn-demo"       class="ctrl-btn-ghost">⬜ Demo [D]</button>
        <button id="btn-fullscreen" class="ctrl-btn-ghost">⛶ Fullscreen [F]</button>
        <label class="ctrl-label">Chakra:
          <select id="chakra-select" class="ctrl-select">
            <option value="#00BFFF">Blue (default)</option>
            <option value="#FF3333">Red (Nine-Tails)</option>
            <option value="#9B59B6">Purple (Rinnegan)</option>
            <option value="#2ECC71">Green (Medical)</option>
            <option value="#F1C40F">Gold</option>
          </select>
        </label>
        <span id="model-status" class="status-text">Loading model…</span>
      </div>
    </div>
  </div>

  <!-- Exit-demo hint (visible only in demo mode) -->
  <div id="demo-hint">Press D to exit demo</div>

  <!-- CDN libraries (globals: Holistic, SelfieSegmentation, Camera, tf) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"></script>

  <!-- Main app (ES6 module) -->
  <script type="module" src="app.js"></script>
</body>
</html>
